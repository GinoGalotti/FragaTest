name: evaluation-harness

# Manual only for now: the harness illustrates the test structure.
# Later stages would add: push (quick checks), pull_request (integration), schedule (nightly).
on:
  workflow_dispatch:

jobs:
  golden-cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest harness -v
